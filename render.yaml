services:
  - type: web
    name: staffplan
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: SESSION_COOKIE_NAME
        value: staffplan_session
      # SMTP / Email (set in Render Dashboard → Environment → Environment Variables)
      - key: SMTP_HOST
        value: smtp.zeptomail.in
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: emailapikey
      - key: SMTP_PASSWORD
        value: your-zeptomail-api-key
      - key: SMTP_FROM_EMAIL
        value: no-reply@skilledca.in
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_INVITATION_FROM_EMAIL
        value: invitation@skilledca.in
